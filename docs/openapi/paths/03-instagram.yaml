  /api/instagram:
    get:
      tags: [Instagram]
      summary: Posts et reels affichés sur le site (du plus récent au plus ancien ajouté, 24 au plus)
      operationId: getInstagramPosts
      responses:
        '200':
          description: Liste des posts
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstagramPost' } }
    post:
      tags: [Instagram]
      summary: Ajouter un post ou un reel à partir de son lien
      operationId: addInstagramPost
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, examples: ['https://www.instagram.com/reel/DAbcdEFGhij/'] }
      responses:
        '201':
          description: Post ajouté ; renvoie la liste à jour
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstagramPost' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/instagram/{id}:
    delete:
      tags: [Instagram]
      summary: Retirer un post du site (il reste publié sur Instagram)
      operationId: deleteInstagramPost
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Post retiré ; renvoie la liste à jour
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstagramPost' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/instagram/{id}/video:
    post:
      tags: [Instagram]
      summary: Joindre la vidéo d'un post (stockage local ; corps = fichier MP4, WEBM ou MOV brut)
      description: |
        La vidéo est lue en boucle, sans le son, à la place du lecteur Instagram (qui interdit la lecture automatique).
        Avec Supabase Storage : demander une URL signée à `/api/media/upload-url`, y envoyer le fichier, puis appeler `/api/instagram/{id}/video/complete`.
      operationId: uploadInstagramVideo
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          video/*: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Vidéo jointe ; renvoie la liste à jour
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstagramPost' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { description: Le fichier n'est pas une vidéo MP4, WEBM ou MOV }
    delete:
      tags: [Instagram]
      summary: Retirer la vidéo jointe (le site revient au lecteur Instagram)
      operationId: deleteInstagramVideo
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Vidéo retirée ; renvoie la liste à jour
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstagramPost' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/instagram/{id}/video/complete:
    post:
      tags: [Instagram]
      summary: Rattacher au post une vidéo envoyée directement à Supabase Storage
      operationId: completeInstagramVideo
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectPath]
              properties:
                objectPath: { type: string, description: Chemin renvoyé par /api/media/upload-url }
      responses:
        '200':
          description: Vidéo jointe ; renvoie la liste à jour
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstagramPost' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { description: Le fichier n'est pas une vidéo MP4, WEBM ou MOV }

  /api/instagram/{id}/hero:
    put:
      tags: [Instagram]
      summary: Mettre la vidéo jointe du post en tête de l'accueil (ou l'en retirer)
      description: Une seule vidéo d'accueil à la fois ; le média « hero » choisi dans la galerie est retiré (et inversement).
      operationId: setInstagramHero
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                on: { type: boolean, default: true }
      responses:
        '200':
          description: Accueil mis à jour ; renvoie la liste à jour
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InstagramPost' } }
        '400': { description: Le post n'a pas de vidéo jointe }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
