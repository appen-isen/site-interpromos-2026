  /api/registrations:
    get:
      tags: [Inscriptions]
      summary: Liste des inscriptions (admin)
      operationId: listRegistrations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Inscriptions et compteurs par statut
          content:
            application/json:
              schema:
                type: object
                properties:
                  regs: { type: array, items: { $ref: '#/components/schemas/Registration' } }
                  counts:
                    type: object
                    properties:
                      pending: { type: integer }
                      ok: { type: integer }
                      no: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Inscriptions]
      summary: Inscrire une équipe (public)
      description: |
        Contrôles : prénom + nom pour chaque joueur, pas de doublon, nombre de joueurs selon le sport, nom d'équipe
        unique par promo et par sport, joueur non déjà inscrit dans une autre équipe du même sport.
        Limité à 20 envois par adresse IP sur 10 minutes.
        Refusé (403, code `REGISTRATIONS_CLOSED`) quand le BDS a fermé les inscriptions ou que l'échéance
        (à défaut le coup d'envoi du tournoi) est passée.
      operationId: createRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sportIndex, promo, team, captain, email, players, rules]
              properties:
                sportIndex: { type: integer, minimum: 0 }
                sport: { type: string, description: Nom du sport (secours si sportIndex est absent) }
                promo: { type: string, examples: [A3] }
                team: { type: string, maxLength: 60 }
                captain: { type: string, maxLength: 80 }
                email: { type: string, format: email, maxLength: 120 }
                players:
                  type: array
                  items: { type: string, examples: [Prénom Nom] }
                rules: { type: boolean, const: true, description: Acceptation du règlement }
      responses:
        '201':
          description: Dossier enregistré (en attente de validation BDS)
          content:
            application/json:
              schema:
                type: object
                properties:
                  reg: { $ref: '#/components/schemas/Registration' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: Inscriptions closes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/registrations/{id}:
    parameters:
      - $ref: '#/components/parameters/Uuid'
    patch:
      tags: [Inscriptions]
      summary: Valider ou refuser une inscription
      operationId: updateRegistrationStatus
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/RegistrationStatus' }
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  reg: { $ref: '#/components/schemas/Registration' }
                  regs: { type: array, items: { $ref: '#/components/schemas/Registration' } }
                  teams: { type: array, items: { $ref: '#/components/schemas/Team' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Inscriptions]
      summary: Supprimer une inscription
      description: Supprime aussi les joueurs rattachés à aucune autre équipe. Refusé si l'équipe a déjà des matchs.
      operationId: deleteRegistration
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Inscription supprimée
          content:
            application/json:
              schema:
                type: object
                properties:
                  regs: { type: array, items: { $ref: '#/components/schemas/Registration' } }
                  teams: { type: array, items: { $ref: '#/components/schemas/Team' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

