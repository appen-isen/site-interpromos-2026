<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interpromos · ISEN Nantes</title>
    <meta name="theme-color" content="#0f0e0e">
    <script>
        // Thème appliqué avant l'affichage : choix mémorisé, sinon réglage de l'appareil
        try {
            var t = localStorage.getItem('ip_theme');
            document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t
                : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="stylesheet" href="/assets/css/main.css">
    <script type="module" src="/assets/js/main.js?v=4"></script>
</head>
<body data-initial-page="home">
    <div id="root"></div>
</body>
</html>
