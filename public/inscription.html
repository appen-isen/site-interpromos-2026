<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription · Interpromos</title>
    <meta name="theme-color" content="#f6f4f3">
    <script>
        // Thème appliqué avant l'affichage : choix mémorisé, sinon thème clair
        try {
            var t = localStorage.getItem('ip_theme');
            document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="stylesheet" href="/assets/css/main.css">
    <script type="module" src="/assets/js/main.js?v=4"></script>
</head>
<body data-initial-page="inscription">
    <div id="root"></div>
</body>
</html>
