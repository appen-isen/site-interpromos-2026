# Intégration continue
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: Mettre en production après les tests (branche main, après approbation)
        type: boolean
        default: false
      migrate:
        description: Migrer aussi la base de production pendant la mise en production
        type: boolean
        default: false


permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Fichiers modifiés
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
      server: ${{ steps.filter.outputs.server }}
      database: ${{ steps.filter.outputs.database }}
      api-docs: ${{ steps.filter.outputs.api-docs }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Détection des répertoires touchés
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          all() {
            echo "$1 : tous les contrôles sont lancés."
            for key in site server database api-docs deps; do echo "$key=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }

          case "$EVENT" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            push) base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            *) all "Lancement manuel" ;;
          esac
          # Nouvelle branche ou historique réécrit : rien de fiable à comparer
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            all "Point de comparaison introuvable"
          fi

          files=$(git diff --name-only "$base...$head")
          echo "Fichiers modifiés :"; echo "$files" | sed 's/^/  /'

          if echo "$files" | grep -qE '^\.github/workflows/'; then all "Workflows modifiés"; fi

          has() { if echo "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          {
            echo "site=$(has '^public/')"
            echo "server=$(has '^(app\.js|index\.js|backend/|scripts/|package(-lock)?\.json|\.nvmrc)')"
            echo "database=$(has '^(backend/sql/|backend/data/|scripts/migrate\.js)')"
            echo "api-docs=$(has '^(docs/openapi/|backend/api/|app\.js|scripts/check-openapi\.js)')"
            echo "deps=$(has '^(package(-lock)?\.json|\.nvmrc)')"
          } | tee -a "$GITHUB_OUTPUT"

  static:
    name: Contrôles statiques
    needs: changes
    if: >-
      needs.changes.outputs.site == 'true' || needs.changes.outputs.server == 'true'
      || needs.changes.outputs.api-docs == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts : aucun script d'installation des dépendances n'est exécuté
      - name: Installation des dépendances
        run: npm ci --ignore-scripts

      - name: Syntaxe JavaScript
        if: needs.changes.outputs.site == 'true' || needs.changes.outputs.server == 'true'
        run: npm run check:syntax

      - name: Cohérence de la documentation OpenAPI
        if: needs.changes.outputs.api-docs == 'true' || needs.changes.outputs.server == 'true'
        run: npm run check:openapi

      - name: Audit de sécurité des dépendances
        if: needs.changes.outputs.deps == 'true'
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Revue des nouvelles dépendances
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  integration:
    name: Intégration (PostgreSQL ${{ matrix.postgres }})
    needs: [changes, static]
    if: >-
      !cancelled() && needs.static.result != 'failure'
      && (needs.changes.outputs.server == 'true' || needs.changes.outputs.database == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Version de Supabase (15) et version récente (17)
        postgres: ['15', '17']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interpromos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      CHECK_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interpromos_test
      PORT: 3000
      APP_URL: http://localhost:3000
      # Compte local de l'Espace BDS (Supabase Auth n'est pas utilisé dans la CI)
      LOCAL_ADMIN_EMAIL: ci@interpromos.test
      LOCAL_ADMIN_PASSWORD: mot-de-passe--de-test
      CHECK_ADMIN: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci --ignore-scripts

      - name: Migration sur une base vierge
        run: npm run db:migrate

      - name: Migration rejouée (doit rester sans effet)
        run: npm run db:migrate

      - name: Démarrage du serveur
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/api/ping" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Le serveur n'a pas démarré en 30 secondes"
          cat server.log
          exit 1

      - name: Vérification des connexions et des routes
        run: npm run check:connections

      - name: Journal du serveur
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-log-postgres-${{ matrix.postgres }}
          path: server.log
          retention-days: 7

  
  ci-result:
    name: CI
    needs: [changes, static, dependency-review, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Bilan
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::Au moins un contrôle a échoué ou a été annulé."; exit 1 ;;
            esac
          done
          echo "Tous les contrôles nécessaires sont passés."

  deploy-production:
    name: Mise en production
    needs: [changes, ci-result]
    # Sur main uniquement, après des tests verts, quand le site ou le serveur a changé (ou à la demande).
    # Le job attend l'approbation d'un relecteur de l'environnement « production » avant de démarrer.
    if: >-
      needs.ci-result.result == 'success'
      && github.ref == 'refs/heads/main'
      && github.repository == 'appen-isen/site-interpromos-2026'
      && (
        (github.event_name == 'push' && (
          needs.changes.outputs.site == 'true' || needs.changes.outputs.server == 'true'
          || needs.changes.outputs.database == 'true' || needs.changes.outputs.api-docs == 'true'
          || needs.changes.outputs.deps == 'true'))
        || (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Relecteurs obligatoires, branche main uniquement, secrets de production :
    # Settings → Environments → production
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
    # Une seule mise en production à la fois, jamais interrompue. Si plusieurs fusions attendent
    # l'approbation, seule la plus récente reste en attente.
    concurrency:
      group: production
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MIGRATE: ${{ needs.changes.outputs.database == 'true' || (github.event_name == 'workflow_dispatch' && inputs.migrate) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci --omit=dev --ignore-scripts

      - name: Configuration
        run: |
          missing=""
          for name in DATABASE_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret(s) absent(s) de l'environnement GitHub « production » :$missing"
            exit 1
          fi

      # Avant le déploiement : le nouveau code trouve un schéma à jour (les migrations n'ajoutent que des colonnes et des vues)
      # Refuse une base marquée « development » ; marque la base « production » au premier passage
      - name: Migration du schéma
        if: env.MIGRATE == 'true'
        run: node scripts/migrate.js --production

      # Les déploiements automatiques de Vercel sont coupés (vercel.json) : la prod ne change que par ce job approuvé
      - name: Déploiement Vercel
        run: npx --yes vercel@65.11.0 deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Vérification de la production (lecture seule)
        env:
          CHECK_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          APP_URL: ${{ vars.APP_URL }}
        run: npm run check:connections
