# Intégration continue
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Contrôles statiques
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Syntaxe JavaScript
        run: npm run check:syntax

      - name: Cohérence de la documentation OpenAPI
        run: npm run check:openapi

      - name: Audit de sécurité des dépendances
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Intégration (PostgreSQL ${{ matrix.postgres }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Versions 
        postgres: ['15', '17']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interpromos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      CHECK_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interpromos_test
      PORT: 3000
      APP_URL: http://localhost:3000
      # Compte local de l'Espace BDS (Supabase Auth n'est pas utilisé dans la CI)
      LOCAL_ADMIN_EMAIL: ci@interpromos.test
      LOCAL_ADMIN_PASSWORD: mot-de-passe--de-test
      CHECK_ADMIN: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Migration sur une base vierge
        run: npm run db:migrate

      - name: Migration rejouée (doit rester sans effet)
        run: npm run db:migrate

      - name: Démarrage du serveur
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/api/ping" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Le serveur n'a pas démarré en 30 secondes"
          cat server.log
          exit 1

      - name: Vérification des connexions et des routes
        run: npm run check:connections

      - name: Journal du serveur
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-postgres-${{ matrix.postgres }}
          path: server.log
          retention-days: 7

  migrate-production:
    name: Migration production
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Une seule migration à la fois, et jamais interrompue en cours de route
    concurrency:
      group: migration-production
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci --omit=dev

      - name: Configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL absent de l'environnement GitHub « production »"
            exit 1
          fi

      # Refuse une base marquée « development » ; marque la base « production » au premier passage
      - name: Migration du schéma
        run: node scripts/migrate.js --production

      - name: Vérification de la production (lecture seule)
        env:
          CHECK_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
          APP_URL: ${{ vars.APP_URL }}
        run: npm run check:connections

  pr-develop:
    name: Pull request vers develop
    needs: integration
    # Branches de travail uniquement (ni main, ni develop, ni les mises à jour Dependabot qui ont leur propre PR)
    if: >-
      github.event_name == 'push'
      && github.ref_name != 'main'
      && github.ref_name != 'develop'
      && !startsWith(github.ref_name, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ouverture de la pull request
        run: |
          existing=$(gh pr list --head "$BRANCH" --base develop --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            echo "Pull request déjà ouverte : $existing (mise à jour automatiquement par ce push)"
            exit 0
          fi

          ahead=$(git rev-list --count "origin/develop..HEAD")
          if [ "$ahead" -eq 0 ]; then
            echo "Rien à fusionner : $BRANCH ne contient aucun commit absent de develop."
            exit 0
          fi

          body=$(printf '%s\n' \
            "Pull request ouverte automatiquement : tous les tests de \`$BRANCH\` sont passés (contrôles statiques et intégration PostgreSQL 15 et 17)." \
            "" \
            "Commits à fusionner dans \`develop\` ($ahead) :" \
            "" \
            "$(git log --format='- %s' "origin/develop..HEAD")")

          if ! gh pr create --base develop --head "$BRANCH" --title "Merge $BRANCH into develop" --body "$body"; then
            echo "::error::Création refusée. Vérifiez Settings → Actions → General → « Allow GitHub Actions to create and approve pull requests »."
            exit 1
          fi
