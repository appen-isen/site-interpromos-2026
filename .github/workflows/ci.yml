# Intégration continue
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Contrôles statiques
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Syntaxe JavaScript
        run: npm run check:syntax

      - name: Cohérence de la documentation OpenAPI
        run: npm run check:openapi

      - name: Audit de sécurité des dépendances
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Intégration (PostgreSQL ${{ matrix.postgres }})
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Versions 
        postgres: ['15', '17']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interpromos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      CHECK_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interpromos_test
      PORT: 3000
      APP_URL: http://localhost:3000
      # Compte local de l'Espace BDS (Supabase Auth n'est pas utilisé dans la CI)
      LOCAL_ADMIN_EMAIL: ci@interpromos.test
      LOCAL_ADMIN_PASSWORD: mot-de-passe-ci
      CHECK_ADMIN: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Migration sur une base vierge
        run: npm run db:migrate

      - name: Migration rejouée (doit rester sans effet)
        run: npm run db:migrate

      - name: Démarrage du serveur
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "$APP_URL/api/ping" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::Le serveur n'a pas démarré en 30 secondes"
          cat server.log
          exit 1

      - name: Vérification des connexions et des routes
        run: npm run check:connections

      - name: Journal du serveur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-postgres-${{ matrix.postgres }}
          path: server.log
          retention-days: 7
