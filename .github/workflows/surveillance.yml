name: Surveillance

on:
  schedule:
    - cron: '0 5 7 * *'   # tous les jours, 6 h (heure d'hiver)
  workflow_dispatch:

permissions: {}

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  production:
    name: Production
    if: github.repository == 'appen-isen/site-interpromos-2026' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Environnement séparé, sans relecteurs : « production » exige une approbation, ce qui bloquerait
    # la vérification quotidienne. Mêmes secrets, idéalement avec un compte base de données en lecture seule.
    environment: surveillance
    permissions:
      contents: read

    env:
      CHECK_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation des dépendances
        run: npm ci --omit=dev --ignore-scripts

      - name: Vérification des connexions (lecture seule)
        run: npm run check:connections

  audit:
    name: Failles des dépendances
    if: github.repository == 'appen-isen/site-interpromos-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Une faille publiée après la dernière modification du code est repérée ici sans attendre une PR
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
