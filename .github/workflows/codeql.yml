# Analyse de sécurité du code JavaScript (CodeQL) : injections, XSS, failles d'authentification…
# Les alertes apparaissent dans l'onglet Security du dépôt.
name: CodeQL

on:
  pull_request:
    branches: [main, develop]
    paths: ['**.js', '.github/workflows/codeql.yml']
  push:
    branches: [main]
    paths: ['**.js', '.github/workflows/codeql.yml']
  schedule:
    - cron: '0 6 * * 1'   # chaque lundi : nouvelles règles appliquées au code existant
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyse JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript
