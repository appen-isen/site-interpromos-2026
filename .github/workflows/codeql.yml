# Analyse de sécurité du code JavaScript (CodeQL) : injections, XSS, failles d'authentification…
# Les alertes apparaissent dans l'onglet Security du dépôt.
name: CodeQL

on:
  pull_request:
    branches: [main, develop]
    paths: ['**.js', '.github/workflows/codeql.yml']
  push:
    branches: [main]
    paths: ['**.js', '.github/workflows/codeql.yml']
  schedule:
    - cron: '0 6 * * 1'   # chaque lundi : nouvelles règles appliquées au code existant
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyse JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3.39.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3.39.2
        with:
          category: /language:javascript
