            <span class="phoenix"><img src="assets/logo_bds.svg" alt="Logo Interpromos"></span>

        <button class="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="navigation">

        <div class="actions" style="margin-bottom: 45px;">
